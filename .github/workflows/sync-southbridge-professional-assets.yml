name: Sync SouthBridge professional assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-southbridge-professional-assets.yml'

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical production portraits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/resources
          base='https://southbridge-talent-rm0amy.v2.appdeploy.ai/resources'
          for n in 01 02 03 04 05 06 07 08 09 10; do
            target="public/resources/sb-professional-${n}.png"
            curl --fail --location --retry 3 --silent --show-error "${base}/sb-professional-${n}.png" --output "${target}"
            test -s "${target}"
            size=$(wc -c < "${target}")
            if [ "${size}" -lt 25000 ]; then
              echo "Asset ${n} is unexpectedly small (${size} bytes)" >&2
              exit 1
            fi
          done

      - name: Commit canonical portrait library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/resources/sb-professional-*.png
          if git diff --cached --quiet; then
            echo 'Canonical assets already match production.'
            exit 0
          fi
          git commit -m 'Add canonical SouthBridge professional image library'
          git push origin HEAD:main
